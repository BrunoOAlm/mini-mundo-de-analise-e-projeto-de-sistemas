# Cloudflare Pages: projeto faeterj (site em https://fallscar.faeterj.pages.dev). A pasta publicada é montada por
# scripts/pacote.mjs em .dist (site + _worker.js com a API em /api/*).
name = "faeterj"
pages_build_output_dir = ".dist"
compatibility_date = "2026-11-01"

[[d1_databases]]
binding = "DB"
database_name = "fallscar"
# id do banco remoto (criado com wrangler d1 create fallscar); em desenvolvimento local não é usado
database_id = "0a0ead8c-41f7-4075-9ffc-67d4bc990615"
migrations_dir = "server/migracoes"

[vars]
# iterações do PBKDF2 das senhas: o plano gratuito do Workers limita a CPU por requisição; 10 000 cabe nesse limite
# (o formato guardado registra as iterações, então dá para subir depois sem perder as senhas existentes)
PBKDF2_ITER = "10000"
